<footer class="site-footer">
  <div class="colophon">
    &copy; {{ site.time | date: '%Y' }} {{ site.author.name }}. Built with Jekyll on GitHub Pages.
  </div>
  <div>
    {% if site.social.github %}<a href="https://github.com/{{ site.social.github }}" rel="me">github</a>{% endif %}
    {% if site.social.scholar %} · <a href="{{ site.social.scholar }}" rel="me">scholar</a>{% endif %}
    {% if site.author.email %} · <a href="mailto:{{ site.author.email }}">email</a>{% endif %}
  </div>
</footer>
