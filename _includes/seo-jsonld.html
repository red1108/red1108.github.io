{% assign page_type = page.schema | default: page.layout %}
{% if page_type == 'home' %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": "{{ site.author.name | escape }}",
  "url": "{{ site.url }}",
  "description": "{{ page.description | default: site.description | escape }}",
  "alternateName": ["Mingyu Lee", "이민규", "red1108"],
  "sameAs": [
    {% assign wrote_same_as = false %}
    {% if site.social.github %}"https://github.com/{{ site.social.github }}"{% assign wrote_same_as = true %}{% endif %}
    {% if site.social.scholar %}{% if wrote_same_as %}, {% endif %}"{{ site.social.scholar }}"{% assign wrote_same_as = true %}{% endif %}
    {% if site.social.orcid %}{% if wrote_same_as %}, {% endif %}"{{ site.social.orcid }}"{% assign wrote_same_as = true %}{% endif %}
    {% if site.social.linkedin %}
      {% assign linkedin_url = site.social.linkedin %}
      {% unless linkedin_url contains '://' %}
        {% assign linkedin_url = 'https://www.linkedin.com/in/' | append: site.social.linkedin %}
      {% endunless %}
      {% if wrote_same_as %}, {% endif %}"{{ linkedin_url }}"
    {% endif %}
  ]
}
</script>
{% elsif page.collection == 'shares' %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BlogPosting",
  "headline": "{{ page.title | escape }}",
  "datePublished": "{{ page.date | date_to_xmlschema }}",
  "dateModified": "{{ page.last_modified_at | default: page.date | date_to_xmlschema }}",
  "inLanguage": "{{ page.language | default: site.lang }}",
  "author": {
    "@type": "Person",
    "name": "{{ site.author.name | escape }}"
  },
  "description": "{{ page.summary | default: page.excerpt | strip_html | normalize_whitespace | escape }}",
  "keywords": [{% for tag in page.tags %}"{{ tag }}"{% if forloop.last == false %}, {% endif %}{% endfor %}],
  "mainEntityOfPage": "{{ page.url | absolute_url }}"
}
</script>
{% endif %}
