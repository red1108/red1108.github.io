---
classes:
- id: R
  label: R
  name: Decidable languages
  family: computability
  hint:
    x: 0.46
    "y": 0.52
  definition: Languages $L$ for which some Turing machine halts on every input $x$
    and accepts iff $x \in L$.
- id: RE
  label: RE
  name: Recursively enumerable languages
  family: computability
  hint:
    x: 0.5
    "y": 0.5
  definition: Languages $L$ for which some Turing machine accepts exactly the inputs
    $x \in L$ (it may run forever on $x \notin L$).
- id: EXP
  label: EXP
  name: Exponential time
  family: deterministic
  hint:
    x: 0.45
    "y": 0.52
  definition: "$\\mathsf{EXP} = \\bigcup_{k} \\mathsf{DTIME}\\left(2^{n^k}\\right)$:
    languages decided deterministically in time $2^{\\mathrm{poly}(n)}$."
- id: P
  label: P
  name: Polynomial time
  family: deterministic
  hint:
    x: 0.47
    "y": 0.58
  definition: "$\\mathsf{P} = \\bigcup_{k} \\mathsf{DTIME}\\left(n^k\\right)$: languages
    decided by a deterministic Turing machine in polynomial time."
- id: NP
  label: NP
  name: Nondeterministic polynomial time
  family: deterministic
  hint:
    x: 0.37
    "y": 0.58
  definition: "$x \\in L \\iff \\exists\\, w \\in \\{0,1\\}^{\\mathrm{poly}(|x|)}$
    with $V(x, w) = 1$, for a deterministic polynomial-time verifier $V$."
- id: NEXP
  label: NEXP
  name: Nondeterministic exponential time
  family: deterministic
  hint:
    x: 0.45
    "y": 0.5
  definition: "$\\mathsf{NEXP} = \\bigcup_{k} \\mathsf{NTIME}\\left(2^{n^k}\\right)$:
    like $\\mathsf{NP}$, but with exponentially long certificates and verification
    time."
- id: PH
  label: PH
  name: Polynomial hierarchy
  family: deterministic
  hint:
    x: 0.33
    "y": 0.52
  definition: "$\\mathsf{PH} = \\bigcup_{k} \\Sigma_k^{p}$, where $\\Sigma_1^{p} =
    \\mathsf{NP}$ and $\\Sigma_{k+1}^{p} = \\mathsf{NP}^{\\Sigma_k^{p}}$."
- id: PSPACE
  label: PSPACE
  name: Polynomial space
  family: deterministic
  hint:
    x: 0.45
    "y": 0.5
  definition: "$\\mathsf{PSPACE} = \\bigcup_{k} \\mathsf{SPACE}\\left(n^k\\right)$:
    languages decided using polynomial memory (and unbounded time)."
- id: BPP
  label: BPP
  name: Bounded-error probabilistic polynomial time
  family: randomized
  hint:
    x: 0.52
    "y": 0.6
  definition: A polynomial-time randomized algorithm $A$ with $\Pr[A(x) = L(x)] \ge
    2/3$ for every input $x$.
- id: PP
  label: PP
  name: Probabilistic polynomial time
  family: randomized
  hint:
    x: 0.58
    "y": 0.5
  definition: A polynomial-time randomized algorithm $A$ with $\Pr[A(x) = L(x)] >
    1/2$ for every input $x$ (unbounded error).
- id: AM
  label: AM
  name: Arthur–Merlin
  family: interactive
  hint:
    x: 0.37
    "y": 0.54
  definition: Arthur sends random coins $r$, Merlin answers with $m$, Arthur decides
    by a deterministic poly-time predicate $V(x, r, m)$. Completeness $\ge 2/3$, soundness
    $\le 1/3$.
- id: MA
  label: MA
  name: Merlin–Arthur
  family: interactive
  hint:
    x: 0.44
    "y": 0.58
  definition: 'Merlin sends a classical proof $w$; Arthur runs a $\mathsf{BPP}$ verifier.
    $x \in L \Rightarrow \exists w: \Pr[\text{accept}] \ge 2/3$; $x \notin L \Rightarrow
    \forall w: \Pr[\text{accept}] \le 1/3$.'
- id: IP
  label: IP
  name: Interactive proofs
  family: interactive
  hint:
    x: 0.42
    "y": 0.48
  definition: A randomized poly-time verifier exchanges $\mathrm{poly}(n)$ messages
    with an all-powerful prover. Completeness $\ge 2/3$, soundness $\le 1/3$ against
    every prover.
- id: MIP
  label: MIP
  name: Multi-prover interactive proofs
  family: interactive
  hint:
    x: 0.42
    "y": 0.46
  definition: Like $\mathsf{IP}$, but with two (or polynomially many) provers who
    cannot communicate with each other.
- id: BQP
  label: BQP
  name: Bounded-error quantum polynomial time
  family: quantum
  hint:
    x: 0.6
    "y": 0.58
  definition: Decided by a uniform family of $\mathrm{poly}(n)$-size quantum circuits
    $\{Q_n\}$ with $\Pr[Q_{|x|}(x) = L(x)] \ge 2/3$.
- id: QMA
  label: QMA
  name: Quantum Merlin–Arthur
  family: quantum
  hint:
    x: 0.58
    "y": 0.53
  definition: 'Merlin sends a quantum proof $|\psi\rangle$ on $\mathrm{poly}(n)$ qubits;
    Arthur runs a $\mathsf{BQP}$ verifier. $x \in L \Rightarrow \exists |\psi\rangle:
    \Pr[\text{accept}] \ge 2/3$; $x \notin L \Rightarrow \forall |\psi\rangle: \Pr[\text{accept}]
    \le 1/3$.'
- id: QIP
  label: QIP
  name: Quantum interactive proofs
  family: quantum-interactive
  hint:
    x: 0.56
    "y": 0.46
  definition: Like $\mathsf{IP}$, but the verifier is a poly-time quantum circuit
    and the messages are quantum states.
- id: QCMA
  label: QCMA
  name: Quantum Classical Merlin–Arthur
  family: quantum
  hint:
    x: 0.54
    "y": 0.56
  definition: Like $\mathsf{QMA}$, but the proof is a classical string $w \in \{0,1\}^{\mathrm{poly}(n)}$
    checked by a quantum verifier.
- id: QMA2
  label: QMA(2)
  name: QMA with two unentangled provers
  family: quantum
  hint:
    x: 0.66
    "y": 0.46
  definition: Like $\mathsf{QMA}$, but the proof is promised to be a product state
    $|\psi_1\rangle \otimes |\psi_2\rangle$ from two unentangled Merlins.
- id: PostBQP
  label: PostBQP
  name: Postselected BQP
  family: quantum
  hint:
    x: 0.6
    "y": 0.5
  definition: "$\\mathsf{BQP}$ with postselection: the circuit may condition on an
    outcome that occurs with probability $> 0$, however small."
- id: MIPstar
  label: MIP*
  name: Multi-prover interactive proofs with entangled provers
  family: quantum-interactive
  hint:
    x: 0.72
    "y": 0.44
  definition: Classical polynomial-time interactive verification with non-communicating
    provers sharing an arbitrary finite-dimensional entangled state. Completeness
    $\ge 2/3$ and soundness $\le 1/3$.
problems:
- id: HALT
  label: HALT
  name: Halting problem
  hint:
    x: 0.84
    "y": 0.6
  description: Given a Turing machine $M$ and input $x$, does $M$ halt on $x$?
  kind: language
- id: SAT
  label: SAT
  name: Boolean satisfiability
  hint:
    x: 0.3
    "y": 0.62
  description: Does a Boolean formula $\varphi$ have a satisfying assignment? $\mathsf{NP}$-complete.
  kind: language
- id: FACTORING
  label: FACTORING
  name: Integer factoring
  hint:
    x: 0.52
    "y": 0.62
  description: Given $N$ and $k$, does $N$ have a prime factor $\le k$? This is a
    decision version of factoring.
  kind: language
- id: GI
  label: GI
  name: Graph isomorphism
  hint:
    x: 0.34
    "y": 0.66
  description: Given two graphs $G$ and $H$, is there a bijection of vertices preserving
    adjacency?
  kind: language
- id: TQBF
  label: TQBF
  name: True quantified Boolean formulas
  hint:
    x: 0.4
    "y": 0.3
  description: Is $\exists x_1 \forall x_2 \exists x_3 \cdots\, \varphi(x_1, x_2,
    \ldots)$ true? $\mathsf{PSPACE}$-complete.
  kind: language
- id: MAJSAT
  label: MAJSAT
  name: Majority satisfiability
  hint:
    x: 0.64
    "y": 0.42
  description: Is $\varphi$ satisfied by more than half of all assignments? $\mathsf{PP}$-complete.
  kind: language
- id: PRIMES
  label: PRIMES
  name: Primality testing
  hint:
    x: 0.47
    "y": 0.6
  description: Given an integer $N$, is $N$ prime? Membership statements below are
    restricted to the selected timeline position.
  kind: language
- id: LH
  label: k-LH
  name: k-local Hamiltonian
  hint:
    x: 0.62
    "y": 0.54
  description: Given $H = \sum_i H_i$ with each $H_i$ acting on $k$ qubits, is $\lambda_{\min}(H)
    \le a$ or $\ge b$ (with $b - a \ge 1/\mathrm{poly}(n)$)? $\mathsf{QMA}$-complete.
  kind: promise
