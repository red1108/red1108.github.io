scope: The membranes compare language classes with standard uniform computation and
  bounded error where applicable. Promise problems are identified separately and are
  not plotted as languages.
timeline_policy: Dates use the cited conference or journal publication (including
  original online publication), not later digitization or preprint dates. A preprint-only
  source is explicitly marked. Definition events mark a documented milestone in this
  curated tour, not a claim of priority for the name. Some links point to expanded
  versions; those are labeled.
